const prose = '骑士长单膝跪地，把那面裂开的【盾牌】推到你脚边。';
const runAll = (t) => scripts.reduce((acc, s) => runRegex(s, acc), t);
// 与 ST runRegexScript 相同的替换方式
function runRegex(s, text) {
  const m = s.findRegex.match(/^\/([\s\S]*)\/([a-z]*)$/);
  return text.replace(new RegExp(m[1], m[2]), function () {
    const args = arguments;
    return s.replaceString.replace(/\$(\d+)/g, (_, n) => args[Number(n)] || '');
  });
}
function scopeCssSelectors(css, scopeId) {
  const prefix = '#' + scopeId;
  return css.replace(/([^{}]+)\{([^{}]*)\}/g, function (match, selector, body) {
    var scoped = selector.split(',').map(function (s) {
      s = s.trim();
      if (!s || s.charAt(0) === '@' || s === 'from' || s === 'to' || /^\d+%$/.test(s)) return s;
      return prefix + ' ' + s;
    }).join(', ');
    return scoped + '{' + body + '}';
  });
}
// A/C: 正文美化把顶层 <style> 与紧随的 <div> 包进带 id 的容器
function laneReading(el) {
  const raw = samples.map(s => prose + '\n' + runAll(s) + '\n' + prose).join('\n');
  const w = document.createElement('div'); w.innerHTML = raw;
  w.querySelectorAll(':scope > style').forEach((st, i) => {
    const id = 'shb-' + el.id + i; st.textContent = scopeCssSelectors(st.textContent, id);
    let nx = st.nextElementSibling; const wrap = document.createElement('div'); wrap.id = id;
    st.before(wrap); wrap.appendChild(st); if (nx && nx.tagName === 'DIV') wrap.appendChild(nx);
  });
  el.appendChild(w);
  const miss = samples.filter(s => runAll(s) === s).length;
  if (miss) el.insertAdjacentHTML('afterbegin', '<b style="color:red">有 ' + miss + ' 张卡未匹配</b>');
}
// B: ST messageFormatting 的关键步骤
function laneST(el) {
  DOMPurify.addHook('uponSanitizeAttribute', (node, data) => {
    if (data.attrName === 'class' && data.attrValue) data.attrValue = data.attrValue.split(' ').map(v => 'custom-' + v).join(' ');
  });
  const conv = new showdown.Converter({ emoji: true, literalMidWordUnderscores: true, parseImgDimensions: true, tables: true, underline: true, simpleLineBreaks: true, strikethrough: true, disableForced4SpacesIndentedSublists: true });
  let mes = samples.map(s => prose + '\n' + runAll(s) + '\n' + prose).join('\n\n');
  mes = mes.replace(/<([^>]+)>/g, (_, c) => '<' + c.replace(/"/g, '\ufffe') + '>');
  mes = mes.replace(/<style>[\s\S]*?<\/style>|(\u201C.*?\u201D)|(\u300C.*?\u300D)/gim, (m, p1, p2) => p1 ? '<q>' + p1 + '</q>' : p2 ? '<q>' + p2 + '</q>' : m);
  mes = mes.replace(/\ufffe/g, '"');
  mes = conv.makeHtml(mes);
  mes = mes.replace(/<style>(.+?)<\/style>/gims, (_, c) => '<custom-style>' + encodeURIComponent(c) + '</custom-style>');
  mes = DOMPurify.sanitize(mes, { ADD_TAGS: ['custom-style'] });
  mes = mes.replace(/<custom-style>(.+?)<\/custom-style>/gms, (_, c) => {
    const s = decodeURIComponent(c).replace(/<br\/>/g, '');
    return '<style>' + s.replace(/([^{}]+)\{/g, (m, sel) => sel.trim().charAt(0) === '@' ? m :
      sel.split(',').map(x => '.mes_text ' + x.trim().split(/\s+/).map(p => p.replace(/\.([\w-]+)/g, '.custom-$1')).join(' ')).join(',') + '{') + '</style>';
  });
  el.innerHTML = mes;
}
laneReading(document.getElementById('A'));
